name: deploy

# cd.yml calls this once per GitHub environment. Each environment holds its own
# AWS_REGION, AWS_DEPLOY_ROLE_ARN, CONFIG_ENVIRONMENT and DELETION_PROTECTION variables.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ inputs.environment }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy
        working-directory: infra
        env:
          CONFIG_ENVIRONMENT: ${{ vars.CONFIG_ENVIRONMENT }}
          DELETION_PROTECTION: ${{ vars.DELETION_PROTECTION }}
        run: bun run cdk deploy --all --require-approval never
