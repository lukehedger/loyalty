name: dependencies

on:
  schedule:
    - cron: "7 9 * * 1" # Mondays, offset from the hour to avoid the scheduler rush.
  workflow_dispatch:

concurrency:
  group: dependencies
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: update
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A pull request opened with GITHUB_TOKEN starts no workflows, so CI would never run on it.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Update catalog versions
        run: |
          for pkg in $(jq -r '.catalog | keys[]' package.json); do
            latest=$(npm view "$pkg" version 2>/dev/null || echo "")
            if [ -n "$latest" ]; then
              jq --arg pkg "$pkg" --arg ver "$latest" '.catalog[$pkg] = $ver' package.json > tmp.json && mv tmp.json package.json
            fi
          done

      - name: Update lockfile
        run: bun update --latest

      - name: Audit dependencies
        run: bun audit 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/audit.txt" || true

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet && echo "No dependency changes" && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="automated/dependency-updates"
          git checkout -B "$branch"
          git commit -am "chore: update dependencies"
          git push --force origin "$branch"

          {
            echo "This PR updates every catalog dependency to its latest version and refreshes the lockfile."
            echo
            echo "bun audit reported:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --title "chore: update dependencies" --body-file "$RUNNER_TEMP/pr-body.md" \
            --base main --head "$branch" --label dependencies \
          || gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md" --add-label dependencies
